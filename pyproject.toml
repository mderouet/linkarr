[project]
name = "linkarr"
version = "0.1.0"
description = "Hardlink media organizer for Plex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "guessit>=3.8,<4",
    "aniparse>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests that call the real TMDb API"]

[tool.coverage.run]
source = ["organize"]

[tool.coverage.report]
exclude_lines = ["if __name__"]
